# Shareable SALT demo. Change `app` if the name is taken on Fly.
app = "salt-demo"
primary_region = "iad"

[env]
  SALT_MCP_URL = "https://salt-mcp.fly.dev/mcp"
  # The live assistant's spend totals live here so restarts don't reset them.
  ASSISTANT_DATA_DIR = "/data"
  ASSISTANT_MONTHLY_USD = "10"
  ASSISTANT_DAILY_USD = "2"

[mounts]
  source = "assistant_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleeps when nobody is using it; wakes on the next visit (about a second).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# One machine: the answer cache and visitor limits live in memory, and the
# spend file lives on its one volume.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
